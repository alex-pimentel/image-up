name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    needs: [lint]
    uses: ./.github/workflows/test.yml

  security:
    needs: [lint]
    uses: ./.github/workflows/security.yml

  build:
    needs: [test, security]
    uses: ./.github/workflows/build.yml

  deploy-backend:
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend deploy
        run: curl -fsS "$DEPLOY_BACKEND_WEBHOOK"
        env:
          DEPLOY_BACKEND_WEBHOOK: ${{ secrets.DEPLOY_BACKEND_WEBHOOK }}

  deploy-pages:
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
